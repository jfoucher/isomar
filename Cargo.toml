[workspace]
resolver = "3"
members = ["crates/isomar-core", "crates/isomar-app", "crates/isomar-ffi", "crates/isomar-android", "crates/isomar-gtk", "xtask"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
bzip2 = "0.6.1"
chrono = "0.4.45"
dirs = "7.0.0"
flate2 = "1.1.10"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
grib = { version = "0.20.2", default-features = false, features = ["ccsds-unpack-with-rust-aec", "time-calculation"] }
png = "0.18.1"
rayon = "1.12.0"
roxmltree = "0.21.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
serialport = { version = "4.10.1", default-features = false }
sevenz-rust2 = "0.24.1"
tempfile = "3.27.0"
tiff = "0.11.3"
ureq = "3.5.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
