<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Isomar's iPhone and iPad icon: the art of AppIcon.svg full bleed and opaque, as iOS wants it (the
       system rounds the corners). macos/scripts/make-icon.sh renders it into
       macos/IsomarTouch/Assets.xcassets/AppIcon.appiconset. -->
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="100" height="100"/>
    </clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="scale(10.24)">
    <g id="art" clip-path="url(#tile)">
      <rect width="100" height="100" fill="#e6f1f9"/>
      <!-- Graticule -->
      <path d="M33.3 0V100M66.7 0V100M0 33.3H100M0 66.7H100" stroke="#6b8fa8" stroke-opacity="0.35" stroke-width="0.8" fill="none"/>
      <!-- Depth bands, as wide strokes round the land -->
      <g fill="none" stroke-linejoin="round">
        <g stroke="#c3def2" stroke-width="30">
          <path d="M0 0H70C68 11 60 15 55 22C50 29 53 37 43 42C33 47 25 44 17 52C11 58 5 61 0 62Z"/>
          <ellipse cx="27" cy="74" rx="6" ry="4.5"/>
        </g>
        <g stroke="#9ccbea" stroke-width="14">
          <path d="M0 0H70C68 11 60 15 55 22C50 29 53 37 43 42C33 47 25 44 17 52C11 58 5 61 0 62Z"/>
          <ellipse cx="27" cy="74" rx="6" ry="4.5"/>
        </g>
        <g stroke="#b9d49a" stroke-width="4">
          <path d="M0 0H70C68 11 60 15 55 22C50 29 53 37 43 42C33 47 25 44 17 52C11 58 5 61 0 62Z"/>
        </g>
      </g>
      <!-- Land -->
      <g fill="#f3e2b0" stroke="#2b2b2b" stroke-width="1.3" stroke-linejoin="round">
        <path d="M-2 -2H70C68 11 60 15 55 22C50 29 53 37 43 42C33 47 25 44 17 52C11 58 5 61 -2 62Z"/>
        <ellipse cx="27" cy="74" rx="6" ry="4.5"/>
      </g>
      <!-- Route, haloed -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 91L46 80L74 52L86 17" stroke="#ffffff" stroke-width="7"/>
        <path d="M12 91L46 80L74 52L86 17" stroke="#e0570b" stroke-width="3.4"/>
      </g>
      <g fill="#ffffff" stroke="#e0570b" stroke-width="2.4">
        <circle cx="12" cy="91" r="4"/>
        <circle cx="46" cy="80" r="4"/>
        <circle cx="74" cy="52" r="4"/>
        <circle cx="86" cy="17" r="4"/>
      </g>
      <!-- The boat on the second leg -->
      <path transform="translate(60 66) rotate(45) scale(1.3)" d="M0 -9C4 -4 4.5 3 3.5 8H-3.5C-4.5 3 -4 -4 0 -9Z"
            fill="#111317" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
      <rect width="100" height="50" fill="url(#sheen)"/>
    </g>
  </g>
</svg>
